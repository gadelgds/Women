{% extends "base.html" %}

{% block content %}
<section class="ai-assistant-section">
    <h1>{{ title }}</h1>
    <div class="form-container">
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for f in form %}
                <p>
                    <label for="{{ f.id_for_label }}" class="form-label">{{ f.label }}</label>
                    {{ f }}
                    {{ f.errors }}
                </p>
            {% endfor %}
            <button type="submit" class="btn">Спросить ИИ</button>
        </form>
    </div>

    {% if ai_response %}
    <div class="ai-response-container" style="margin-top: 30px;">
        <h2>Ответ ассистента:</h2>
        <div class="user-prompt" style="font-style: italic; color: #666; margin-bottom: 10px;">
            Вы спросили: "{{ prompt }}"
        </div>
        <blockquote class="ai-response" style="background-color: #f9f9f9; border-left: 5px solid #4CAF50; padding: 15px; border-radius: 5px; white-space: pre-wrap;">
            {{ ai_response }}
        </blockquote>
    </div>
    {% endif %}
</section>
{% endblock %}
