{% load static %}

<header class="header">
  <div class="logo">
    <img class="vector" src="{% static 'main/img/image.svg' %}" alt="FGM Logo Icon" />
    <a href="{% url 'home' %}"><div class="text-wrapper">FGM</div></a>
  </div>
  <button class="burger-menu" aria-label="Открыть меню"
    onclick="document.querySelector('.mobile-nav').classList.toggle('active')">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav class="navbar" aria-label="Основная навигация">
    {% load fgm_tags %}
    {% show_menu %}
  </nav>
  {% if user.is_authenticated %}
    <a href="{% url 'users:profile' %}" class="text-wrapper-2" style="text-decoration:none;">{{ user.username }}</a>
    <form action="{% url 'users:logout' %}" method="post" style="display:inline;">
      {% csrf_token %}
      <button type="submit" class="rectangle-2" style="border:none; cursor:pointer; padding:0; background:none;">
        <span class="text-wrapper-3">Выйти</span>
      </button>
    </form>
  {% else %}
    <a href="{% url 'users:login' %}" class="text-wrapper-2">Войти</a>
    <a href="{% url 'users:register' %}" class="rectangle-2">
      <span class="text-wrapper-3">Регистрация</span>
    </a>
  {% endif %}
  <nav class="mobile-nav" aria-label="Мобильная навигация">
    {% show_menu %}
    {% if user.is_authenticated %}
      <a href="{% url 'users:profile' %}" style="color: white; padding: 10px 0; display: block; text-decoration: none;">{{ user.username }}</a>
      <form action="{% url 'users:logout' %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:0; text-align:left;">Выйти</button>
      </form>
    {% else %}
      <a href="{% url 'users:login' %}">Войти</a>
      <a href="{% url 'users:register' %}" class="mobile-register">Регистрация</a>
    {% endif %}
  </nav>
</header>
