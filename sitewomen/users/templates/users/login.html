{% extends "base.html" %}

{% block content %}
<div class="login-form">
    <h1>Авторизация</h1>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />
        {{ form.non_field_errors }}
        {% for f in form %}
            <p>
                <label for="{{ f.id_for_label }}">{{ f.label }}</label>
                {{ f }}
                {{ f.errors }}
            </p>
        {% endfor %}
        <button type="submit">Войти</button>
    </form>
    <p><a href="{% url 'users:password_reset' %}">Забыли пароль?</a></p>
</div>
{% endblock %}
