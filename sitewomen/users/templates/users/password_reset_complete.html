{% extends "base.html" %}

{% block content %}
<section class="profile-section">
    <div class="profile-content" style="max-width: 520px; margin: 0 auto;">
        <div class="profile-header">
            <h1>Пароль изменён</h1>
            <p class="profile-subtitle">Ваш пароль был успешно обновлён. Теперь вы можете войти с новым паролем.</p>
        </div>

        <div class="profile-form-container">
            <div class="profile-actions">
                <a href="{% url 'users:login' %}" class="btn-submit" style="flex: 1; text-align: center; text-decoration: none;">Войти в аккаунт</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
