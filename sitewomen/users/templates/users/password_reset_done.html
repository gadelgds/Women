{% extends "base.html" %}

{% block content %}
<section class="profile-section">
    <div class="profile-content" style="max-width: 520px; margin: 0 auto;">
        <div class="profile-header">
            <h1>Письмо отправлено</h1>
            <p class="profile-subtitle">Мы отправили инструкции по сбросу пароля на указанный e-mail. Если письмо не пришло — проверьте папку «Спам».</p>
        </div>

        <div class="profile-form-container">
            <div class="profile-actions">
                <a href="{% url 'users:login' %}" class="btn-submit" style="flex: 1; text-align: center; text-decoration: none;">Вернуться к входу</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
