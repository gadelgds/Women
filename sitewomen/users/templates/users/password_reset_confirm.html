{% extends "base.html" %}

{% block content %}
<div class="login-form">
    <h1>Установка нового пароля</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for f in form %}
            <p>
                <label for="{{ f.id_for_label }}">{{ f.label }}</label>
                {{ f }}
                {{ f.errors }}
            </p>
        {% endfor %}
        <button type="submit">Установить пароль</button>
    </form>
</div>
{% endblock %}
